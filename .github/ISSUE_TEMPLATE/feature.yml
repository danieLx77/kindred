name: Feature
description: Propose or implement a user-facing capability.
title: "[Feature]: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for functionality that delivers value to Kindred users.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this feature needed? What problem or user need does it address?
      placeholder: Describe the problem and relevant context.
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be delivered?
      placeholder: Describe the expected outcome without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true for this issue to be considered complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Requirement references
      description: Reference relevant requirements, user stories, acceptance criteria, ADRs, or documentation.
      placeholder: |
        - US-XX
        - RF-XX
        - CA-XX
        - ADR-XXX
        - docs/...
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List issues, external services, or other work required by this feature.
      placeholder: |
        - Depends on #...
        - Requires ...
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add mockups, technical constraints, references, or other useful context.
    validations:
      required: false

  - type: checkboxes
    id: readiness
    attributes:
      label: Ready checklist
      options:
        - label: The objective is clear enough to be implemented and reviewed.
          required: true
        - label: The acceptance criteria are testable.
          required: true